- name: Install packages
  apt:
    name: 
      - htop
      - mc
      - tmux
      - vim
      - bat

- name: Clone auto-cpufreq repository
  ansible.builtin.git:
    repo: https://github.com/AdnanHodzic/auto-cpufreq.git
    dest: /tmp/auto-cpufreq
    version: master
    depth: 1
  become: true

- name: Run auto-cpufreq installer
  ansible.builtin.command:
    cmd: ./auto-cpufreq-installer --install
    chdir: /tmp/auto-cpufreq
    creates: /usr/local/bin/auto-cpufreq
  become: true

- name: Install and enable auto-cpufreq systemd daemon
  ansible.builtin.command:
    cmd: auto-cpufreq --install
    creates: /etc/systemd/system/auto-cpufreq.service
  become: true
