- name: Install packages
  apt:
    name: 
      - htop
      - mc
      - tmux
      - vim
      - bat

- name: Clone auto-cpufreq repository
  ansible.builtin.git:
    repo: https://github.com/AdnanHodzic/auto-cpufreq.git
    dest: /tmp/auto-cpufreq
    version: master
    depth: 1
  become: true

- name: Run auto-cpufreq installer
  ansible.builtin.command:
    cmd: ./auto-cpufreq-installer --install
    chdir: /tmp/auto-cpufreq
    creates: /usr/local/bin/auto-cpufreq
  become: true

- name: Install and enable auto-cpufreq systemd daemon
  ansible.builtin.command:
    cmd: auto-cpufreq --install
    creates: /etc/systemd/system/auto-cpufreq.service
  become: true

- name: Download Yazi GPG keyring
  ansible.builtin.get_url:
    url: https://yazi-rs.github.io/builds/yazi-keyring.gpg
    dest: /usr/share/keyrings/yazi-keyring.gpg
    mode: '0644'
  become: true

- name: Add Yazi APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/yazi-keyring.gpg] https://yazi-rs.github.io/builds/ stable main"
    filename: yazi
    state: present
  become: true

- name: Install Yazi
  ansible.builtin.apt:
    name: yazi
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install Yazi preview plugins and dependencies
  ansible.builtin.apt:
    name:
      - chafa        # Image previews in terminal
      - ffmpegthumbnailer # Video previews
      - poppler-utils # PDF previews (pdftoppm)
      - jq           # JSON formatting/previews
      - fd-find      # File searching
      - ripgrep     # Content searching
      - fzf          # Quick navigation
    state: present
  become: true



- name: Create local fonts directory
  ansible.builtin.file:
    path: "/home/rokas/.local/share/fonts"
    state: directory
    mode: '0755'

- name: Download JetBrains Mono Nerd Font
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz
    dest: "/home/rokas/.local/share/fonts"
    remote_src: true
    creates: "/home/rokas/.local/share/fonts/JetBrainsMonoNerdFont-Regular.ttf"

- name: Refresh font cache
  ansible.builtin.command: fc-cache -f
  changed_when: false





- name: Add Ghostty PPA repository (deb822)
  ansible.builtin.deb822_repository:
    name: ghostty-ubuntu
    types: [deb]
    uris: "https://ppa.launchpadcontent.net/mkasberg/ghostty-ubuntu/ubuntu"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0721FDF5FECB88DC6920361657C8EF455CEAE491"
    state: present
  become: true

- name: Install Ghostty
  ansible.builtin.apt:
    name: ghostty
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true




- name: Download Atuin install script
  ansible.builtin.get_url:
    url: https://setup.atuin.sh
    dest: /tmp/atuin-setup.sh
    mode: '0755'

- name: Run Atuin non-interactive installer
  ansible.builtin.command:
    cmd: /tmp/atuin-setup.sh --non-interactive
    creates: /home/rokas/.atuin/bin/atuin
  become: true
  become_user: rokas
  environment:
    HOME: "/home/rokas"

- name: Clean up Atuin setup script
  ansible.builtin.file:
    path: /tmp/atuin-setup.sh
    state: absent

- name: Add Atuin to user PATH in .bashrc
  ansible.builtin.lineinfile:
    path: /home/rokas/.bashrc
    line: 'export PATH="$HOME/.atuin/bin:$PATH"'
    state: present
    create: true

- name: Initialize Atuin shell integration in .bashrc
  ansible.builtin.lineinfile:
    path: /home/rokas/.bashrc
    line: 'eval "$(atuin init bash)"'
    state: present
    create: true










- name: Add FSearch stable PPA (deb822)
  ansible.builtin.deb822_repository:
    name: fsearch-stable
    types: [deb]
    uris: "https://ppa.launchpadcontent.net/christian-boxdoerfer/fsearch-stable/ubuntu"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x75555AFF5215AD9DBFD8CDB952B2FFB2DC496F40"
    state: present
  become: true

- name: Install FSearch
  ansible.builtin.apt:
    name: fsearch
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true



