- name: Install packages
  apt:
    name: 
      - htop
      - mc
      - tmux
      - vim
      - bat

- name: Clone auto-cpufreq repository
  ansible.builtin.git:
    repo: https://github.com/AdnanHodzic/auto-cpufreq.git
    dest: /tmp/auto-cpufreq
    version: master
    depth: 1
  become: true

- name: Run auto-cpufreq installer
  ansible.builtin.command:
    cmd: ./auto-cpufreq-installer --install
    chdir: /tmp/auto-cpufreq
    creates: /usr/local/bin/auto-cpufreq
  become: true

- name: Install and enable auto-cpufreq systemd daemon
  ansible.builtin.command:
    cmd: auto-cpufreq --install
    creates: /etc/systemd/system/auto-cpufreq.service
  become: true

- name: Download Yazi GPG keyring
  ansible.builtin.get_url:
    url: https://yazi-rs.github.io/builds/yazi-keyring.gpg
    dest: /usr/share/keyrings/yazi-keyring.gpg
    mode: '0644'
  become: true

- name: Add Yazi APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/yazi-keyring.gpg] https://yazi-rs.github.io/builds/ stable main"
    filename: yazi
    state: present
  become: true

- name: Install Yazi
  ansible.builtin.apt:
    name: yazi
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install Yazi preview plugins and dependencies
  ansible.builtin.apt:
    name:
      - chafa        # Image previews in terminal
      - ffmpegthumbnailer # Video previews
      - poppler-utils # PDF previews (pdftoppm)
      - jq           # JSON formatting/previews
      - fd-find      # File searching
      - ripgrep     # Content searching
      - fzf          # Quick navigation
    state: present
  become: true



- name: Create local fonts directory
  ansible.builtin.file:
    path: "/home/rokas/.local/share/fonts"
    state: directory
    mode: '0755'

- name: Download JetBrains Mono Nerd Font
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz
    dest: "/home/rokas/.local/share/fonts"
    remote_src: true
    creates: "/home/rokas/.local/share/fonts/JetBrainsMonoNerdFont-Regular.ttf"

- name: Refresh font cache
  ansible.builtin.command: fc-cache -f
  changed_when: false


- name: Ensure software-properties-common is installed
  ansible.builtin.apt:
    name: software-properties-common
    state: present
  become: true

- name: Add Ghostty PPA repository
  ansible.builtin.apt_repository:
    repo: ppa:mkasberg/ghostty-ubuntu
    state: present
  become: true

- name: Install Ghostty
  ansible.builtin.apt:
    name: ghostty
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
