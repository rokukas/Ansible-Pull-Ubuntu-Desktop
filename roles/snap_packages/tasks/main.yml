---
- name: Install snapd
  ansible.builtin.apt:
    name: snapd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check whether configured snaps are installed
  ansible.builtin.command:
    argv:
      - snap
      - list
      - "{{ item.name if item is mapping else item }}"
  loop: "{{ snap_packages }}"
  register: snap_package_checks
  changed_when: false
  failed_when: false

- name: Install missing snaps
  ansible.builtin.command:
    argv: "{{ ['snap', 'install'] + (['--classic'] if (item.item is mapping and item.item.classic | default(false)) else []) + [item.item.name if item.item is mapping else item.item] }}"
  loop: "{{ snap_package_checks.results }}"
  when: item.rc != 0
