---
- name: Add Ulauncher beta repository
  ansible.builtin.deb822_repository:
    name: ulauncher-beta
    types: [deb]
    uris: https://ppa.launchpadcontent.net/agornostal/ulauncher-dev/ubuntu
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x59EBDE772980C381CA13FA59FAF1020699503176
    state: present

- name: Install Ulauncher beta
  ansible.builtin.apt:
    name: ulauncher
    state: present
    update_cache: true
    cache_valid_time: 3600
