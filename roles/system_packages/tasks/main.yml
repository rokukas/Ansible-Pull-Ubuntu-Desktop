---
- name: Remove unsupported Ghostwriter PPA source from previous setup
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/wereturtle-ubuntu-ppa-{{ ansible_distribution_release }}.{{ item }}"
    state: absent
  loop:
    - sources
    - list

- name: Install repository management tools
  ansible.builtin.apt:
    name: software-properties-common
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable the Ubuntu Universe component
  ansible.builtin.command:
    cmd: add-apt-repository --yes universe
  changed_when: false

- name: Install base desktop and administration packages
  ansible.builtin.apt:
    name:
      - curl
      - htop
      - mc
      - tmux
      - vim
      - bat
      - vlc
      - chromium-browser
      - remmina
      - gnome-shell-extension-manager
      - ca-certificates
      - curl
      - gpg
      - lsb-release
      - zathura
    state: present
    update_cache: true
    cache_valid_time: 3600
