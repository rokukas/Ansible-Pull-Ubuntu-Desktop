---
- name: Configure Ubuntu desktop
  hosts: localhost
  connection: local
  become: true

  vars:
    desktop_user: "{{ lookup('env', 'USER') }}"
    desktop_home: "{{ lookup('env', 'HOME') }}"

  roles:
    - system_packages
    - ghostwriter
    - yazi
    - ulauncher
    - applications
    - os_configuration
